services:
  # Bind mounts hide image ownership. Repair fresh/root-owned data directories
  # before starting the non-root app, without deleting or replacing the DB.
  data-init:
    build: .
    image: parlez-chatbot:local
    user: "0:0"
    entrypoint: ["sh", "-c", "mkdir -p /app/data && chown -R appuser:appuser /app/data"]
    volumes:
      - ./data:/app/data
    restart: "no"

  chatbot:
    build: .
    image: parlez-chatbot:local
    depends_on:
      data-init:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./static:/app/static
    # Local-testing port mapping: expose the chatbot directly on the host
    # so it can be hit without going through Caddy (whose 80/443 ports may
    # already be in use by another container on this host). For production,
    # remove this mapping and rely on the Caddy reverse proxy.
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - parlez

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - PARLEZ_HOST=${PARLEZ_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - parlez
    restart: unless-stopped
    depends_on:
      - chatbot

  # Task 4.11 (D6 fix): nightly backup sidecar. Runs the existing
  # backup.py (SQLite online backup, safe while the chatbot is running)
  # against the data volume, writes to a SEPARATE volume so a corrupted
  # app data dir can't take out the backups. Keeps the last 30 backups.
  #
  # Schedule: every 24h. Override via BACKUP_INTERVAL_SECONDS.
  # Host-cron alternative: `0 3 * * *  docker compose -f
  # docker-compose.prod.yml run --rm backup` — also valid.
  backup:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro   # read-only access to the DB
      - backup_data:/backups  # separate volume, NOT inside ./data
    command:
      - sh
      - -c
      - |
        while true; do
          echo "[backup] $$(date -u) — starting nightly backup"
          python backup.py --dest /backups --keep 30 || \
            echo "[backup] FAILED — will retry next cycle"
          sleep $${BACKUP_INTERVAL_SECONDS:-86400}
        done
    restart: unless-stopped
    networks:
      - parlez
    depends_on:
      - chatbot

volumes:
  caddy_data:
  caddy_config:
  backup_data:

networks:
  parlez:
    driver: bridge
