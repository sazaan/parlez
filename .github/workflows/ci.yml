name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # CI extras (Task 3.4): static analysis + coverage.
          pip install bandit pip-audit pytest-cov

      # Task 3.4 — keep ruff scoped to the files we actually maintain until
      # Task 4.1 cleans up the courses/ star-imports (~3400 ruff errors).
      # Tightening to `ruff check .` is the follow-up.
      - name: Lint (scoped)
        run: |
          ruff check main.py db.py engine migrate_to_sqlite.py

      - name: Static analysis (bandit)
        # -ll: only report medium+ severity; skip noise from assert statements.
        run: bandit -r main.py db.py engine -ll

      - name: Dependency audit (non-blocking)
        run: pip-audit -r requirements.txt || true

      - name: Syntax check
        run: |
          python -m py_compile main.py db.py engine/*.py migrate_to_sqlite.py

      - name: Run tests with coverage (gate: 50% to start; raise over time)
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'this-is-a-test-secret-that-is-32-chars-long' }}
          NVIDIA_API_KEY: dummy
        run: |
          pytest tests/ -q \
            --cov=main --cov=db --cov=engine \
            --cov-report=term-missing \
            --cov-fail-under=50

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Task 3.3 — TruffleHog filesystem scan pinned to a release tag. The
      # audit calls for a SHA pin (defense against tag-retargeting); swap the
      # `@v3` tag for a commit SHA in a follow-up PR. We dropped
      # --only-verified because the previous run skipped the `ses_` token.
      - name: TruffleHog filesystem scan
        uses: trufflesecurity/trufflehog@v3
        with:
          extra_args: filesystem . --results=verified,unknown
